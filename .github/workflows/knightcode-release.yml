# Builds the installers for a version tag, signs them, and publishes them as a
# GitHub Release. knightcode.dev/api/ide serves the newest non-prerelease
# release to installed IDEs as their update.
name: knightcode-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The KnightCode commit whose engine these installers carry. Move it on
  # purpose, together with any IDE change that needs the newer engine.
  KNIGHTCODE_REF: 4fba8ab26cad67938a912dde7df459f7eb26a4d0
  # The public half of KNIGHTCODE_UPDATE_SIGNING_KEY, the key RELEASE_SIGNING_KEY
  # in crates/auto_update/src/auto_update.rs holds. Every installed IDE refuses a
  # release signed by any other key, so publishing checks that the two agree.
  RELEASE_PUBLIC_KEY: h+KXYCPEMd8NFDGnGoSXCJR6dB24grbCahb3QH3F7S0=

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - id: version
        name: Match the tag to the crate version
        run: |
          crate="$(grep -m1 '^version = ' crates/zed/Cargo.toml | cut -d '"' -f2)"
          tag="${GITHUB_REF_NAME#v}"
          # v0.2.0-rc.1 is a prerelease of 0.2.0: published, never offered as an update.
          if [ "${tag%%-*}" != "$crate" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $crate in crates/zed/Cargo.toml" >&2
            exit 1
          fi
          if [ "$tag" = "$crate" ]; then prerelease=false; else prerelease=true; fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  bundle:
    needs: version
    name: bundle (${{ matrix.engine }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-2022
            engine: win32-x64
            artifact: target/KnightCode-x86_64.exe
          - os: macos
            runner: macos-15
            engine: darwin-arm64
            triple: aarch64-apple-darwin
            artifact: target/aarch64-apple-darwin/release/KnightCode-aarch64.dmg
          - os: macos
            runner: macos-15
            engine: darwin-x64
            triple: x86_64-apple-darwin
            artifact: target/x86_64-apple-darwin/release/KnightCode-x86_64.dmg
          - os: linux
            runner: ubuntu-22.04
            engine: linux-x64
            artifact: target/release/knightcode-linux-x86_64.tar.gz
          # 24.04, not 22.04: the prebuilt libwebrtc for arm64 calls
          # __arm_tpidr2_save, which only GCC 14's libgcc_s exports. The
          # binary therefore needs a 2024-or-newer distribution on arm64.
          - os: linux
            runner: ubuntu-24.04-arm
            engine: linux-arm64
            artifact: target/release/knightcode-linux-aarch64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      KNIGHTCODE_ENGINE_DIR: ${{ github.workspace }}/knightcode/packages/cli-${{ matrix.engine }}/bin
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: KnightCodeAI/knightcode
          ref: ${{ env.KNIGHTCODE_REF }}
          path: knightcode
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      - name: Build the engine
        working-directory: knightcode
        shell: bash
        run: |
          bun install
          bun run scripts/build.ts --engine --target=${{ matrix.engine }}

      - name: Install the pinned toolchain
        run: rustup show

      - name: Install the Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          ./script/linux
          ./script/download-wasi-sdk
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Bundle for Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: script/bundle-windows.ps1

      - name: Bundle for macOS
        if: matrix.os == 'macos'
        run: script/bundle-mac ${{ matrix.triple }}

      - name: Bundle for Linux
        if: matrix.os == 'linux'
        run: script/bundle-linux

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.engine }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: [version, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          merge-multiple: true

      - name: Sign every installer
        env:
          SIGNING_KEY: ${{ secrets.KNIGHTCODE_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/release-signing-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          public="$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | base64 -w0)"
          if [ "$public" != "$RELEASE_PUBLIC_KEY" ]; then
            echo "KNIGHTCODE_UPDATE_SIGNING_KEY is not the key installed IDEs trust" >&2
            exit 1
          fi
          # The signature covers the SHA-256 digest, which is what the IDE checks.
          for file in assets/*; do
            openssl dgst -sha256 -binary "$file" > "$RUNNER_TEMP/digest"
            openssl pkeyutl -sign -inkey "$key" -rawin -in "$RUNNER_TEMP/digest" -out "$RUNNER_TEMP/signature"
            base64 -w0 "$RUNNER_TEMP/signature" > "$file.sig"
          done
          ls -l assets

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=(--title "KnightCode ${GITHUB_REF_NAME}" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
